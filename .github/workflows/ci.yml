name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
      - name: Setup Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Pint (code style)
        run: ./vendor/bin/pint -v --test
      - name: Run tests
        run: ./vendor/bin/phpunit --colors=never
      - name: PHPStan (static analysis)
        run: |
          if [ -f ./vendor/bin/phpstan ]; then 
            ./vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress --memory-limit=1G; 
          else 
            echo "phpstan not installed (dev only)"; 
          fi
