server {
  listen 80 default_server;
  server_name _;

  # Laravel public directory
  root /var/www/html/backend/public;
  index index.php index.html;

  # Proxy React/Vite dev server under /app (same-origin dev)
  # Ensure /app (no slash) redirects to /app/
  location = /app {
    return 301 $scheme://$http_host/app/;
  }
  location /app/ {
    proxy_pass http://frontend:5173/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Proxy Vite asset/HMR paths referenced with absolute URLs
  location ^~ /src/ {
    proxy_pass http://frontend:5173/src/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
  location ^~ /@vite/ {
    proxy_pass http://frontend:5173/@vite/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
  location ^~ /@id/ {
    proxy_pass http://frontend:5173/@id/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
  location ^~ /@react-refresh {
    proxy_pass http://frontend:5173/@react-refresh;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
  location ^~ /node_modules/ {
    proxy_pass http://frontend:5173/node_modules/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /healthz {
    access_log off;
    return 200 '{"status":"ok"}';
    add_header Content-Type application/json;
  }

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass php:9000;
    fastcgi_index index.php;
  }
}
